<!DOCTYPE html>
<html lang="en">
{{ partial "meta.html" . }}
<body data-page="{{ .Params.title }}">
<div id="mainviewport">
    <div id="sidebarnav"
         class="fixed top-0 left-0 h-full -translate-x-full bg-white z-30 pl-6 pr-3 border-r border-black">
        {{ partial "sidebarnav" . }}
    </div>
    <div id="headernav" class="hidden fixed top-0 left-0 w-full bg-white z-30 px-0 border-b sm:block">
        {{ partial "header" . }}
    </div>
    {{ block "main" . }}
    {{ end }}
</div>
</body>
</html>
