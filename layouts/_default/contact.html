{{ define "main" }}
<div class="flex flex-col flex-nowrap justify-center bg-white" style="min-height: calc(100vh - 10vw - 60px);">
    <div class="flex flex-col flex-nowrap justify-center items-center gap-8 m-auto px-10">
        <div class="select-text flex flex-row justify-center items-start gap-2.5 text-4xl font-medium tracking-wider text-center
                    sm:text-5xl">
            {{ with .Resources.Get "pagecontent/description.md" }}
                {{ .Content }}
            {{ end }}
        </div>
        <div class="select-text flex flex-col flex-nowrap self-center gap-2.5">
            <div class="flex self-center p-1 gap-2.5 font-normal text-lg tracking-wide -mt-4
                        sm:text-xl">
                {{ with .Resources.Get "pagecontent/email.md"}}
                    {{ .Content }}
                {{ end }}
            </div>
            <div class="flex flex-col justify-center items-center mt-9 gap-2.5">
                <a href="mailto:me@jakoblundoe.com" class="flex flex-row flex-nowrap justify-center items-center py-5 px-7 gap-2.5 mt-8 border-2 border-solid border-pink rounded-md transition ease-out duration-200 font-normal text-xl text-pink tracking-wide shadow-user-xsm text-shadow-sm
                hover:bg-transp-grey hover:scale-102 hover:shadow-user-sm
                active:opacity-70
                sm:text-2xl">
                    {{ with .Resources.Get "pagecontent/buttontext.md" }}
                        {{ .Content }}
                    {{ end }}
                </a>
            </div>
        </div>
    </div>
    {{ partial "footer.html" . }}
</div>
{{ end }}
