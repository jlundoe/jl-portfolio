{{ $section := .Site.GetPage "section" "resumecontent" }}
{{ range sort $section.Pages "Params.order" }}
{{ $pageTitle := .Params.title }}
<div class="resume-content w-full">
    <div class="mt-2 py-1">
        <div id="dropdown-button-container-{{ $pageTitle }}" class="flex flex-row flex-nowrap justify-start items-center pb-2 ml-3 hover:cursor-pointer">
            <button id="dropdown-button-{{ $pageTitle }}" class="flex justify-center rotate-180 transition ease-out duration-300 mr-3 ml-2
                            hover:opacity-80 hover:scale-102
                            active:opacity-60
                            ">
                 <div class="flex justify-center">
                     <ion-icon name="chevron-up-sharp" alt="dropdown arrow icon" style="color: rgb(50, 50, 50); font-size: 36px;"></ion-icon>
                 </div>
            </button>
            <h2 class="select-text font-inter font-medium text-xl mx-2.5 text-semilightblack pt-1
                        hover:opacity-80
                        active:opacity-60
                        sm:text-2xl">
                {{ $pageTitle }}
            </h2>
        </div>
    </div>
    <div class="select-text mr-4
                [&_p]:mt-3 [&_p]:mb-3
                [&_ul]:mt-3 [&_ul]:mb-3 [&_li]:ml-6 [&_li]:list-disc
                [&_h3]:font-bold [&_h3]:text-base [&_h3]:text-semilightblack
                [&_h4]:font-bold [&_h4]:text-pink [&_h4]:text-sm [&_h4]:mt-5
                [&_h5]:font-bold [&_h5]:text-lg [&_h5]:text-semilightblack [&_h5]:mt-1
                [&_a]:text-pink [&_a]:font-semibold hover:[&_a]:opacity-80 active:[&_a]:opacity-65
                [&_span]:text-black [&_span]:font-medium
                relative after:absolute ml-6 after:border after:border-t-0 after:border-semilightblack after:w-full
                sm:mr-2
                sm:[&_h3]:text-xl
                sm:[&_h4]:text-lg">
        <div id="dropdown-content-{{ $pageTitle }}" class="grid grid-rows-0fr">
            <div class="overflow-hidden">
                <div class=" select-text pl-1 -mt-4 mb-5">
                    {{ .Content }}
                </div>
            </div>
        </div>
    </div>
</div>
{{ end }}
