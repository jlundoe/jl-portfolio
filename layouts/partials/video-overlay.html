<div class="absolute bottom-4 left-0 right-0 px-6 flex flex-row justify-between items-center pointer-events-none">
    <!-- overlay description -->
    <div class="flex flex-col justify-start items-start gap-0.5 text-nowrap">
        <div class="overlay-item-title">{{ .itemTitle }}</div>
        <div class="overlay-subheader">{{ .subHeader }}</div>
    </div>
    <!-- overlay tags -->
    <div class="flex-col justify-end items-end gap-0.5 hidden
                sm:flex">
        <div class="self-stretch h-4 inline-flex justify-end items-center">
            <div class="text-right justify-start overlay-tag-title">{{ .tagTitle }}
            </div>
        </div>
        <div class="self-stretch h-4 inline-flex justify-end items-center">
            <div class="flex-1 text-right justify-start overlay-year">{{ .year }}
            </div>
        </div>
    </div>
</div>
